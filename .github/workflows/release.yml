name: Release

# Tag-driven release. Packagist has no OIDC trusted publishing — it syncs
# from GitHub automatically once the package is submitted on packagist.org
# (one-time, no secrets in this repo). So "publishing" is: green tests + a
# version tag + a GitHub release; Packagist picks the tag up via its
# GitHub integration.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify tag matches Client::VERSION
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! grep -qx "    public const VERSION = '${TAG#v}';" src/Client.php; then
            echo "::error::src/Client.php does not carry ${TAG#v} (bin/release writes it via scripts/version)"
            exit 1
          fi
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - name: Fetch cassettes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/fetch-cassettes.sh
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit

  github-release:
    needs: test
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # bin/release publishes the release itself, which is what pushes the tag.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists"
            exit 0
          fi
          gh release create "$tag" --title "$tag" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)."
